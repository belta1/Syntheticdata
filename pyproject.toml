[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d10synth"
version = "0.1.0"
description = "PoC de datos sintéticos para el archivo D10 (CMF): generador jerárquico por deudor con muestreo en GPU"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.10",
    "pyarrow>=16",
    "numpy>=1.26",
    "torch>=2.3",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
sql = ["pyodbc>=5"]
dev = ["pytest>=8"]

[project.scripts]
d10synth = "d10synth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
